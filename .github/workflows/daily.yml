name: Daily digest

on:
  schedule:
    # 01:07 UTC = 09:07 SGT. GitHub can start scheduled runs some minutes late.
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 digest.py

      # Keeps a daily record of what was reported. The commit also counts as repo
      # activity, which stops GitHub from pausing the schedule after 60 quiet days.
      - name: Save today's snapshot
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot $(date -u +%F)"
          git push || (git pull --rebase && git push)
